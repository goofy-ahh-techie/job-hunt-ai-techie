server:
  port: 8080

spring:
  application:
    name: job-hunt-copilot-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobhunt}
    username: ${DB_USERNAME:jobhunt}
    password: ${DB_PASSWORD:jobhunt}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          # Persist timestamps in UTC regardless of the host's timezone.
          # The JDBC *connection* timezone is a separate concern handled in
          # JobHuntBackendApplication.applyDefaultTimeZone() — it is negotiated
          # at handshake, before any property here is applied.
          time_zone: UTC
    open-in-view: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    jwt:
      # Override in every non-local environment. HS256 needs >= 32 bytes.
      secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789}
      issuer: ${JWT_ISSUER:job-hunt-copilot}
      access-token-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:3600}

  intelligence:
    base-url: ${INTELLIGENCE_BASE_URL:http://localhost:8000}
    connect-timeout-ms: 3000
    read-timeout-ms: 5000

  storage:
    # Local filesystem root for uploaded resume files. Override per environment.
    resume-dir: ${RESUME_STORAGE_DIR:./uploads/resumes}
    # Reserved for JD file storage. JD uploads currently reuse the Phase 2
    # FileStorageService (rooted at resume-dir); this key marks the intended
    # split-out location for when JD storage gets its own service.
    jd-dir: ${JD_STORAGE_DIR:./uploads/jds}

# Java -> intelligence-python service boundary (Phase 3).
intelligence:
  service:
    url: ${INTELLIGENCE_SERVICE_URL:http://localhost:8000}
    # Short connect timeout: the service is either up or it is not.
    connect-timeout-seconds: ${INTELLIGENCE_CONNECT_TIMEOUT_SECONDS:10}
    # Long read timeout: a JD extraction runs a local LLM that takes tens of
    # seconds (30-66s measured for llama3.2:3b on CPU). This must exceed the
    # intelligence service's own Ollama timeout (120s) or every real extraction
    # would fail with a false "service unavailable".
    read-timeout-seconds: ${INTELLIGENCE_READ_TIMEOUT_SECONDS:130}
    # Semantic matching (Phase 4) gets its own, longer read timeout: one call
    # embeds every resume chunk plus every unmatched JD phrase, so its worst
    # case is a multiple of a single extraction's.
    match-read-timeout-seconds: ${INTELLIGENCE_MATCH_READ_TIMEOUT_SECONDS:180}

# Matching engine (Phase 4). Cosine-similarity floors for the two semantic
# sub-scores, calibrated live against nomic-embed-text: true positives separate
# from unrelated phrases at 0.52-0.60 for short skills and 0.65-0.74 for prose
# responsibilities. Skills sit LOWER than responsibilities because a short phrase
# compared against a paragraph scores lower than paragraph-to-paragraph does.
# Re-tune these whenever the embedding model changes.
matching:
  semantic:
    skills-threshold: ${MATCHING_SKILLS_THRESHOLD:0.50}
    responsibilities-threshold: ${MATCHING_RESPONSIBILITIES_THRESHOLD:0.60}
    # Must-haves arrive from the LLM as full sentences, so they calibrate like
    # responsibilities rather than like skills.
    must-have-threshold: ${MATCHING_MUST_HAVE_THRESHOLD:0.60}

logging:
  level:
    root: INFO
    com.jobhunt.copilot: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always